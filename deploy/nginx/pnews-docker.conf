# PNews Nginx reverse proxy for Docker setup.
# This file is mounted inside the pnews-nginx container.

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    client_max_body_size 20m;

    access_log /var/log/nginx/pnews_access.log;
    error_log /var/log/nginx/pnews_error.log;

    # Health check route
    location = /health {
        access_log off;
        proxy_pass http://pnews-web:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main application route
    location / {
        proxy_pass http://pnews-web:8000;
        proxy_http_version 1.1;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
