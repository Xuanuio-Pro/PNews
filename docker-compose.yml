services:
  pnews-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pnews_web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: python web_app.py --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  pnews-crawler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pnews_crawler
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: python -X utf8 main.py
