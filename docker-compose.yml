services:
  pnews-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pnews_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "web_app.py", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  pnews-crawler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pnews_crawler
    restart: "no"
    env_file:
      - .env
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "-X", "utf8", "main.py"]

  pnews-nginx:
    image: nginx:alpine
    container_name: pnews_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/pnews-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pnews-web
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  pnews-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pnews_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-${CLOULDFARE_TUNNEL_TOKEN:-}}
    depends_on:
      - pnews-nginx
